name: Font QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install font tooling
        run: pip install -r requirements-dev.txt
      - name: Verify reproducible build
        run: |
          ./build.sh
          git diff --exit-code -- fonts/ttf/TeleportationOne-Regular.ttf
      - name: Run Google Fonts quality checks
        run: ./scripts/check.sh --skip-network
