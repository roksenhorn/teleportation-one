name: Teleportation One
repository_url: https://github.com/roksenhorn/teleportation-one.git
branch: main
category:
  - DISPLAY
designer: Ryan Oksenhorn
build: |
  python3 -m venv .venv
  . .venv/bin/activate
  pip install -r requirements.txt
  ./build.sh
files:
