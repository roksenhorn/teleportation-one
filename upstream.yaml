  fonts/ttf/TeleportationOne-Regular.ttf: TeleportationOne-Regular.ttf
  documentation/article/ARTICLE.en_us.html: article/ARTICLE.en_us.html
  documentation/article/teleportation-one-specimen.png: article/teleportation-one-specimen.png
